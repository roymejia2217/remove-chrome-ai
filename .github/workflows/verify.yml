name: Verify

on:
  push:
    branches:
      - master
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  commit-messages:
    name: Commit Message Governance
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout complete history
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: npm

      - name: Install pinned governance dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Self-test commit message contract
        run: npm run test:commitlint

      - name: Validate pull request title
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          printf '%s\n' "$PR_TITLE" |
            npm exec --no -- commitlint --config commitlint.title.config.cjs --verbose

      - name: Validate pull request commit range
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          npm exec --no -- commitlint             --from "$BASE_SHA"             --to "$HEAD_SHA"             --verbose

      - name: Validate protected branch commit range
        if: github.event_name == 'push'
        env:
          BASE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          npm exec --no -- commitlint             --from "$BASE_SHA"             --to "$HEAD_SHA"             --verbose

  quality:
    name: Quality and tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # 1.98.1
        with:
          toolchain: 1.98.1
          components: rustfmt, clippy

      - name: Self-test pull request description contract
        if: github.event_name == 'pull_request'
        run: python3 scripts/validate_pr_description.py --self-test

      - name: Validate pull request description
        if: github.event_name == 'pull_request'
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          printf '%s' "$PR_BODY" > "$RUNNER_TEMP/pull-request.md"
          python3 scripts/validate_pr_description.py \
            --body-file "$RUNNER_TEMP/pull-request.md"

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Check compilation
        run: cargo check --locked --all-targets

      - name: Run tests
        run: cargo test --locked --all-targets

      - name: Enforce Standard Readme and remark-lint
        run: |
          set -euo pipefail
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            --env HOME=/tmp \
            --volume "$PWD:/remove-chrome-ai" \
            --workdir /remove-chrome-ai \
            docker.io/library/node:24.14.1-bookworm-slim@sha256:b506e7321f176aae77317f99d67a24b272c1f09f1d10f1761f2773447d8da26c \
            sh -eu -c 'cd ci/readme-policy && NPM_CONFIG_IGNORE_SCRIPTS=true npm ci && cd ../.. && ci/readme-policy/node_modules/.bin/remark README.md --frail --rc-path ci/readme-policy/.remarkrc.json'

      - name: Check README links
        run: |
          set -euo pipefail
          docker run --rm \
            --volume "$PWD:/remove-chrome-ai:ro" \
            --workdir /remove-chrome-ai \
            lycheeverse/lychee:0.24.2@sha256:e2d19e57cf6ab037026f20b8e449a1f30d9d7f81eef4194763aab2eab20bd28d \
            --no-progress --root-dir . README.md

  required-ci:
    name: Required CI
    if: ${{ always() }}
    needs:
      - commit-messages
      - quality
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Enforce commit and quality results
        env:
          COMMIT_RESULT: ${{ needs.commit-messages.result }}
          QUALITY_RESULT: ${{ needs.quality.result }}
        run: |
          test "$COMMIT_RESULT" = "success"
          test "$QUALITY_RESULT" = "success"
