name: Release Tag Guard

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  validate-release-tag:
    name: Release Tag Guard
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout tag history
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # 1.98.1
        with:
          toolchain: 1.98.1

      - name: Validate release tag provenance
        shell: bash
        run: |
          set -euo pipefail

          git fetch origin master:refs/remotes/origin/master

          PACKAGE_VERSION="$(
            cargo metadata --locked --no-deps --format-version 1 |
              python3 -c 'import json,sys; data=json.load(sys.stdin); print(next(p for p in data["packages"] if p["name"]=="remove-chrome-ai")["version"])'
          )"

          EXPECTED_TAG="v$PACKAGE_VERSION"
          test "$GITHUB_REF_NAME" = "$EXPECTED_TAG"

          TAG_COMMIT="$(git rev-parse "$GITHUB_SHA^{commit}")"
          MASTER_COMMIT="$(git rev-parse refs/remotes/origin/master)"
          test "$TAG_COMMIT" = "$MASTER_COMMIT"
